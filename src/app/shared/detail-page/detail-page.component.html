<div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <a [routerLink]="back" class="text-gray-500 hover:text-[#7c3aed] font-black text-sm">← Back to List</a>
      <a *ngIf="editPrefix && item" [routerLink]="[editPrefix, item.productId || item.supplierId || item.warehouseId || item.id]" class="btn-primary">✎ Edit Profile</a>
    </div>
    <div *ngIf="item" class="grid lg:grid-cols-[360px_1fr] gap-5 md:gap-8">
      <div class="ui-profile-card">
        <div class="ui-profile-photo" *ngIf="item.imageUrl; else defaultProfileIcon">
          <img [src]="imageSrc(item.imageUrl)" [alt]="item[titleField] || 'Product photo'">
        </div>
        <ng-template #defaultProfileIcon>
          <div class="ui-profile-icon">▣</div>
        </ng-template>
        <h1>{{item[titleField]}}</h1>
        <p>{{item.contactPerson || item.sku || item.location || item.email || "StockPro record"}}</p>
        <span class="badge bg-emerald-100 text-emerald-700 mt-4">{{item.isActive === false ? "Inactive" : "Active"}}</span>
      </div>
      <div class="ui-detail-card">
        <h2>Operational Details</h2>
        <div class="grid md:grid-cols-2 gap-4 mt-6">
          <div *ngFor="let kv of visibleEntries(item)" class="ui-detail-item"><p>{{kv[0]}}</p><strong>{{kv[1]}}</strong></div>
        </div>
      </div>
    </div>
  </div>
