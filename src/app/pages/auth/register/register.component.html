<auth-shell title="Join Us!" subtitle="Create your StockPro account" mark="S">
      <form (ngSubmit)="submit()" class="space-y-4">
        <input class="input" name="fullName" [(ngModel)]="form.fullName" required placeholder="Full Name">
        <input class="input" name="phone" [(ngModel)]="form.phone" required placeholder="Phone Number">
        <input class="input" name="email" [(ngModel)]="form.email" required type="email" placeholder="Email">
        <div class="relative">
          <input class="input pr-14" name="password" [(ngModel)]="form.password" required [type]="showPassword ? 'text' : 'password'" placeholder="Password">
          <button type="button" class="absolute inset-y-0 right-3 my-auto h-9 px-2 text-xs font-black text-[#7c3aed] hover:text-[#5b21b6]" (click)="showPassword=!showPassword">
            {{showPassword ? "Hide" : "Show"}}
          </button>
        </div>
        <div *ngIf="otpSent" class="space-y-2">
          <input class="input" name="otp" [(ngModel)]="form.otp" required maxlength="6" inputmode="numeric" placeholder="Enter email OTP">
          <button class="btn-soft w-full" type="button" (click)="sendOtp()" [disabled]="sendingOtp">{{sendingOtp ? "Sending..." : "Resend OTP"}}</button>
        </div>
        <button class="btn-primary w-full" type="submit" [disabled]="sendingOtp || creating">
          {{otpSent ? (creating ? "Creating..." : "Verify OTP & Create Account") : (sendingOtp ? "Sending OTP..." : "Send OTP")}}
        </button>
      </form>
      <div class="flex items-center gap-3 my-6">
        <span class="h-px flex-1 bg-gray-200"></span>
        <span class="text-[10px] font-black uppercase tracking-widest text-gray-400">or</span>
        <span class="h-px flex-1 bg-gray-200"></span>
      </div>
      <button class="btn-soft w-full flex items-center justify-center gap-3" type="button" (click)="googleLogin()">
        <svg class="h-5 w-5 flex-none" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.37c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.14 5.37 12 5.37z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>
      <p class="text-sm mt-10 text-center text-gray-500 font-medium">Already a member? <a routerLink="/login" class="text-[#7c3aed] font-bold hover:underline">Login Here</a></p>
    </auth-shell>
