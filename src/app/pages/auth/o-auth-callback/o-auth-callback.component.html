<auth-shell title="Signing You In" subtitle="Finishing Google authentication" mark="G">
      <div class="text-center space-y-4">
        <p class="text-sm font-semibold text-gray-500">{{message}}</p>
        <a *ngIf="failed" routerLink="/login" class="text-[#7c3aed] font-bold hover:underline">Back to Login</a>
      </div>
    </auth-shell>
