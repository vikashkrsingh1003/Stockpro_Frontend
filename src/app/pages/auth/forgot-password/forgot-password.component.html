<auth-shell title="Forgot Password?" subtitle="Reset your password with email OTP" mark="?">
      <form *ngIf="!submitted" (ngSubmit)="submit()" class="space-y-5">
        <input class="input" type="email" name="email" [(ngModel)]="email" required placeholder="example@mail.com">
        <ng-container *ngIf="otpSent">
          <input class="input" name="otp" [(ngModel)]="otp" required maxlength="6" inputmode="numeric" placeholder="Enter email OTP">
          <div class="relative">
            <input class="input pr-14" name="newPassword" [(ngModel)]="newPassword" required [type]="showPassword ? 'text' : 'password'" placeholder="New password">
            <button type="button" class="absolute inset-y-0 right-3 my-auto h-9 px-2 text-xs font-black text-[#7c3aed] hover:text-[#5b21b6]" (click)="showPassword=!showPassword">
              {{showPassword ? "Hide" : "Show"}}
            </button>
          </div>
          <button class="btn-soft w-full" type="button" (click)="sendOtp()" [disabled]="loading">{{loading ? "Sending..." : "Resend OTP"}}</button>
        </ng-container>
        <button class="btn-primary w-full" type="submit" [disabled]="loading">
          {{otpSent ? (loading ? "Resetting..." : "Verify OTP & Reset Password") : (loading ? "Sending..." : "Send OTP")}}
        </button>
      </form>
      <div *ngIf="submitted" class="text-center bg-purple-50 p-6 rounded-2xl border border-purple-100">
        <p class="text-[#7c3aed] font-semibold mb-4">Password reset successfully!</p>
        <a routerLink="/login" class="text-[#7c3aed] font-bold hover:underline">Back to Login</a>
      </div>
    </auth-shell>
